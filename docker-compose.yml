version: '3.9'

services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - glms-network

  glms-backend-api:
    build:
      context: .             # Root folder
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    depends_on:
      - sql-server-db
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development  # <--- CRITICAL: This enables Swagger inside Docker
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=GLMSDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
    ports:
      - "8080:8080" # Maps local port 8080 to container port 8080
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS/Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-backend-api
    environment:
      - ApiBaseUrl=http://glms-backend-api:8080/
    ports:
      - "8081:8080" # Maps local port 8081 to container port 8080
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge